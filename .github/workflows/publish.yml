name: Update mining dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - 'requirements.lock'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '17 3 1 * *'

permissions:
  contents: read

concurrency:
  group: mining-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check runtime and accounting
        run: |
          python scripts/preflight.py
          python -m unittest discover -s tests -v
      - name: Query public wallets and pool
        run: python scripts/collect.py --previous-url https://iamruzi.github.io/prl-nock-monitor/data/status.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1
      - name: Publish dashboard
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  keep-schedule-active:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Monthly activity to prevent 60-day schedule expiry
        run: |
          date -u +%Y-%m > .schedule-heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .schedule-heartbeat
          if ! git diff --cached --quiet; then
            git commit -m 'Maintain scheduled collection'
            git push
          fi
